<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tic Tac Toe: play a friend or the computer, with best-of-N matches and a live scoreboard.">
  <title>Tic Tac Toe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2312152b'/%3E%3Cpath d='M25 25L50 50M50 25L25 50' stroke='%23ff6b81' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='68' cy='68' r='14' fill='none' stroke='%2336d7e0' stroke-width='9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="logic.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">

    <!-- Setup screen -->
    <section id="setup" class="panel" aria-labelledby="title">
      <h1 id="title">Tic Tac <span class="x">X</span><span class="o">O</span></h1>
      <p class="subtitle">Pick your settings and start a match.</p>

      <form id="setup-form">
        <fieldset>
          <legend>Game mode</legend>
          <div class="segmented">
            <input type="radio" id="mode-pvc" name="mode" value="pvc" checked><label for="mode-pvc">vs Computer</label>
            <input type="radio" id="mode-pvp" name="mode" value="pvp"><label for="mode-pvp">2 Players</label>
          </div>
        </fieldset>

        <div id="cpu-options">
          <fieldset>
            <legend>Difficulty</legend>
            <div class="segmented">
              <input type="radio" id="diff-easy" name="difficulty" value="easy"><label for="diff-easy">Easy</label>
              <input type="radio" id="diff-medium" name="difficulty" value="medium" checked><label for="diff-medium">Medium</label>
              <input type="radio" id="diff-hard" name="difficulty" value="hard"><label for="diff-hard">Hard</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>You play as</legend>
            <div class="segmented">
              <input type="radio" id="side-x" name="side" value="X" checked><label for="side-x"><span class="x">X</span> (moves first)</label>
              <input type="radio" id="side-o" name="side" value="O"><label for="side-o"><span class="o">O</span></label>
            </div>
          </fieldset>
        </div>

        <fieldset>
          <legend>Match length (best of)</legend>
          <div class="segmented">
            <input type="radio" id="best-1" name="bestOf" value="1"><label for="best-1">1 round</label>
            <input type="radio" id="best-3" name="bestOf" value="3" checked><label for="best-3">3 rounds</label>
            <input type="radio" id="best-5" name="bestOf" value="5"><label for="best-5">5 rounds</label>
            <input type="radio" id="best-7" name="bestOf" value="7"><label for="best-7">7 rounds</label>
          </div>
          <p class="hint" id="best-hint"></p>
        </fieldset>

        <button type="submit" class="primary">Start match</button>
      </form>

      <div class="alltime" aria-labelledby="alltime-title">
        <h2 id="alltime-title">All-time matches won</h2>
        <p id="alltime-pvc"></p>
        <p id="alltime-pvp"></p>
        <button type="button" class="link" id="reset-stats">Reset stats</button>
      </div>
    </section>

    <!-- Game screen -->
    <section id="game" class="panel" hidden aria-label="Game">
      <p class="match-info" id="match-info"></p>

      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score x-side" id="score-x">
          <span class="score-name" id="name-x"></span>
          <span class="score-value" id="value-x">0</span>
          <span class="pips" id="pips-x" aria-hidden="true"></span>
        </div>
        <div class="score draws-side">
          <span class="score-name">Draws</span>
          <span class="score-value" id="value-draws">0</span>
        </div>
        <div class="score o-side" id="score-o">
          <span class="score-name" id="name-o"></span>
          <span class="score-value" id="value-o">0</span>
          <span class="pips" id="pips-o" aria-hidden="true"></span>
        </div>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="board" id="board" role="group" aria-label="Tic Tac Toe board"></div>

      <div class="controls">
        <button type="button" class="primary" id="next-round" hidden>Next round</button>
        <button type="button" class="secondary" id="restart">Restart match</button>
        <button type="button" class="secondary" id="menu">Menu</button>
      </div>
    </section>

    <footer class="footer">Built with HTML, CSS and vanilla JavaScript</footer>
  </main>

  <!-- Match result -->
  <dialog id="result-dialog" aria-labelledby="result-title">
    <h2 id="result-title"></h2>
    <p id="result-text"></p>
    <div class="controls">
      <button type="button" class="primary" id="play-again">Play again</button>
      <button type="button" class="secondary" id="dialog-menu">Menu</button>
    </div>
  </dialog>
</body>
</html>
